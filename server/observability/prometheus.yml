global:
  scrape_interval: 15s
  scrape_timeout: 5s
rule_files:
  - /etc/prometheus/rules/freedomvpn.yml
scrape_configs:
  - job_name: freedomvpn-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:3000"]
